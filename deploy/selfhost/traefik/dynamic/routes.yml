# =============================================================================
# HTTP Routing Configuration
# =============================================================================

http:
  routers:
    # Self-registration lock: deny the public Register entrypoints (Connect-RPC
    # procedure + REST mirror). Login and all other auth flows stay open.
    block-register:
      rule: "PathPrefix(`/proto.auth.v1.AuthService/Register`) || Path(`/api/v1/auth/register`)"
      entryPoints:
        - web
      service: backend
      middlewares:
        - deny-all
      priority: 110

    # Backend API
    api:
      rule: "PathPrefix(`/api`) || PathPrefix(`/health`)"
      entryPoints:
        - web
      service: backend
      priority: 100

    # Connect-RPC procedures; the web image proxies /proto.* only in dev
    connect:
      rule: "HeaderRegexp(`Connect-Protocol-Version`, `.+`)"
      entryPoints:
        - web
      service: backend
      priority: 95

    # Relay (WebSocket for terminal streaming)
    relay:
      rule: "PathPrefix(`/relay`)"
      entryPoints:
        - web
      service: relay
      middlewares:
        - relay-strip
      priority: 90

    # Web Frontend (catch-all)
    web:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      service: web
      priority: 1

  services:
    backend:
      loadBalancer:
        servers:
          - url: "http://backend:8080"

    relay:
      loadBalancer:
        servers:
          - url: "http://relay:8090"

    web:
      loadBalancer:
        servers:
          - url: "http://web:3000"

  middlewares:
    relay-strip:
      stripPrefix:
        prefixes:
          - "/relay"

    # Unsatisfiable source range -> traefik returns 403 for every request.
    deny-all:
      ipAllowList:
        sourceRange:
          - "192.0.2.1/32"
