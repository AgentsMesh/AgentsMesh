stages:
  - sync
  - build
  - deploy

variables:
  USE_BAZEL_VERSION: "8.2.1"

sync:github:
  stage: sync
  image:
    name: "$BAZEL_BUILDER_IMAGE"
    entrypoint: [""]
  tags:
    - docker
    - x86
  script:
    - |
      set -euo pipefail
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      git fetch --no-tags --force \
        https://github.com/AgentsMesh/AgentsMesh.git \
        main:refs/remotes/github/main

      github_sha="$(git rev-parse refs/remotes/github/main)"
      if [ "$github_sha" = "$CI_COMMIT_SHA" ]; then
        echo "GitLab main already matches GitHub main: $github_sha"
        exit 0
      fi

      git push \
        --force-with-lease="refs/heads/main:$CI_COMMIT_SHA" \
        "$CI_REPOSITORY_URL" \
        "$github_sha:refs/heads/main"

      curl --fail-with-body --silent --show-error \
        --request POST \
        --form "token=$CI_JOB_TOKEN" \
        --form "ref=main" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/trigger/pipeline" \
        >/dev/null
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

build:images:
  stage: build
  image:
    name: "$BAZEL_BUILDER_IMAGE"
    entrypoint: [""]
    docker:
      user: "0"
  tags:
    - docker
    - x86
  parallel:
    matrix:
      - SERVICE: backend
        TARGET: //backend/cmd/server:image_push_agentsmesh
        REPOSITORY_PATH: agentsmesh/backend
      - SERVICE: runner
        TARGET: //runner/cmd/runner:image_push_agentsmesh
        REPOSITORY_PATH: agentsmesh/runner
      - SERVICE: relay
        TARGET: //relay/cmd/relay:image_push_agentsmesh
        REPOSITORY_PATH: agentsmesh/relay
      - SERVICE: web
        TARGET: //clients/web:image_push_agentsmesh
        REPOSITORY_PATH: agentsmesh/web
      - SERVICE: web-admin
        TARGET: //clients/web-admin:image_push_agentsmesh
        REPOSITORY_PATH: agentsmesh/web-admin
  script:
    - |
      set -euo pipefail
      : "${CORP_REGISTRY:?CORP_REGISTRY is required}"
      : "${BAZEL_REGISTRY_MIRROR:?BAZEL_REGISTRY_MIRROR is required}"

      downloader_config="$CI_PROJECT_DIR/.gitlab-downloader.cfg"
      printf '%s\n' \
        "rewrite bcr.bazel.build/(.*) ${BAZEL_REGISTRY_MIRROR}/\$1" \
        'rewrite registry.npmjs.org/(.*) repo.huaweicloud.com/repository/npm/$1' \
        'rewrite static.crates.io/crates/([^/]+)/([^/]+)/download rsproxy.cn/api/v1/crates/$1/$2/download' \
        > "$downloader_config"

      case "$SERVICE" in
        web|web-admin)
          : "${ELECTRON_MIRROR:?ELECTRON_MIRROR is required for frontend images}"
          electron_version="33.4.11"
          electron_get_version="2.0.3"
          electron_sha256="212d431c7c916292311c797cd91f84467c5abd6e6983cf24b162efff64cee8a9"

          if ! grep -Fqx "electronVersion: ${electron_version}" clients/desktop/electron-builder.yml || \
              ! grep -Fqx "  electron@${electron_version}:" pnpm-lock.yaml || \
              ! grep -Fqx "  '@electron/get@${electron_get_version}':" pnpm-lock.yaml || \
              ! grep -Fqx "      '@electron/get': ${electron_get_version}" pnpm-lock.yaml; then
            echo "Electron cache pins no longer match the resolved dependencies; update this CI block."
            exit 1
          fi

          electron_artifact="electron-v${electron_version}-linux-x64.zip"
          # The hermetic lifecycle sees Electron's default URL, so the cache key must use it.
          electron_release="https://github.com/electron/electron/releases/download/v${electron_version}"
          electron_cache_key="$(printf '%s' "$electron_release" | sha256sum | awk '{print $1}')"
          electron_cache_dir="/root/.cache/electron/${electron_cache_key}"
          electron_cache_file="${electron_cache_dir}/${electron_artifact}"

          mkdir -p "$electron_cache_dir"
          if [ ! -f "$electron_cache_file" ] || \
              ! printf '%s  %s\n' "$electron_sha256" "$electron_cache_file" | sha256sum --check --status; then
            electron_tmp="$(mktemp "${electron_cache_file}.tmp.XXXXXX")"
            trap 'rm -f "$electron_tmp"' EXIT
            curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 300 \
              --retry 3 --retry-delay 2 \
              --output "$electron_tmp" \
              "${ELECTRON_MIRROR%/}/v${electron_version}/${electron_artifact}"
            printf '%s  %s\n' "$electron_sha256" "$electron_tmp" | sha256sum --check
            mv "$electron_tmp" "$electron_cache_file"
            trap - EXIT
          fi
          ;;
      esac

      short_sha="$(printf '%.7s' "$CI_COMMIT_SHA")"
      export IMAGE_VERSION="sha-${short_sha}"
      export IMAGE_MINOR="main"
      bazel run \
        --config=ci \
        --stamp \
        --action_env=ELECTRON_MIRROR \
        --downloader_config="$downloader_config" \
        --workspace_status_command=build_defs/workspace_status.sh \
        "$TARGET" -- --repository="${CORP_REGISTRY}/${REPOSITORY_PATH}"
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CORP_REGISTRY != ""'
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

deploy:internal:
  stage: deploy
  needs:
    - build:images
  tags:
    - deploy
    - linux
  resource_group: agentsmesh-internal
  interruptible: false
  environment:
    name: internal
    url: "$INTERNAL_ENVIRONMENT_URL"
  script:
    - |
      set -euo pipefail
      : "${INTERNAL_DEPLOY_HOST:?INTERNAL_DEPLOY_HOST is required}"
      : "${INTERNAL_DEPLOY_DIR:?INTERNAL_DEPLOY_DIR is required}"

      version="sha-$(printf '%.7s' "$CI_COMMIT_SHA")"
      ssh -o BatchMode=yes -o ConnectTimeout=10 "$INTERNAL_DEPLOY_HOST" \
        "cd '$INTERNAL_DEPLOY_DIR' && git pull --ff-only origin main && ./deploy.sh internal --version '$version'"
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AUTO_DEPLOY_INTERNAL == "true"'
    - if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
